<head>

  <!-- 5. Wordle board / history system -->

  <script>

    <div id="appContainer">
      <!-- ========== HEADER ========== -->
      <header class="app-header">
        <h1 class="title">VS WORDLE</h1>
        <div id="toast" class="toast"></div>
      </header>
    <!-- ========== MAIN ========== -->
      <main id="appMain">
<!-- ========== START UP ========== -->
        <section id="startupScreen" class="screen active game-menu">
          <div class="menu-center">
            <h1 class="menu-title">VS WORDLE</h1>
            <div id="menuAccountStatus" class="menu-account-status"></div>
            <div class="menu-buttons">
              <button id="quickPlayBtn" class="menu-btn primary">Quick Play</button>
              <button id="accountBtn" class="menu-btn">Account</button>
              <button id="leaderboardBtn" class="menu-btn">Leaderboard</button>
              <button class="menu-btn">Options</button>
              <button class="menu-btn">How to Play</button>
            </div>
          </div>
        </section>
<!-- ========== LEADErbOArD ========== -->
  <section id="leaderboardScreen" class="screen game-menu">
  <div class="menu-center">
    <h2 class="menu-title">Leaderboard</h2>

    <div class="leaderboard-tabs">
      <button class="leaderboard-tab active" data-mode="bullet">Bullet</button>
      <button class="leaderboard-tab" data-mode="blitz">Blitz</button>
      <button class="leaderboard-tab" data-mode="notime">No Time</button>
      <button class="leaderboard-tab" data-mode="deep">Deep</button>
    </div>

    <div id="leaderboardList" class="leaderboard-list">
      Loading…
    </div>

    <button class="menu-btn" onclick="showScreen('startupScreen')">
      Back
    </button>
  </div>
</section>

<!-- ========== ACCOUNT ========== -->
<section id="accountScreen" class="screen game-menu">
  <div class="menu-center">
    <h2 class="menu-title">Account</h2>
  <button id="showPastGamesBtn">Past Games</button>
    <input id="authEmail" type="email" placeholder="Email" />
    <input id="authPassword" type="password" placeholder="Password" />
<input id="usernameInput" type="text" placeholder="Username" maxlength="16"/>
<button id="saveUsernameBtn" class="menu-btn primary"> Save Username </button>

    <div class="menu-buttons">
      <button id="signupBtn" class="menu-btn primary">Sign Up</button>
      <button id="loginBtn" class="menu-btn">Log In</button>
      <button id="logoutBtn" class="menu-btn hidden">Log Out</button>
      <button id="backBtn" class="menu-btn">Back</button>
    </div>

    <p id="authStatus" class="auth-status"></p>
  </div>
</section>

<!-- ========== LOBBY ========== -->
<section id="lobby" class="screen screen-lobby">
  <div class="panel lobby-panel">
  
    <!-- Header -->
    <div class="lobby-header">
      <h2 class="screen-title">Lobby</h2>
  
      <div class="room-code-wrap">
        <span class="room-label">Room</span>
        <span id="roomCodeLabel" class="room-code">----</span>
      </div>
    </div>
  
    <!-- Waiting indicator -->
    <div id="waitingForPlayer" class="waiting-block">
      <div class="spinner"></div>
      <p>Waiting for player…</p>
    </div>
  
    <!-- ROLE SELECTION -->
    <div class="role-select">
    
      <!-- SETTER -->
      <div class="role-card setter">
        <div class="lobby-role-header">
          <span class="role-title">Setter</span>
    
          <!-- Host badge -->
          <span
            class="host-badge hidden"
            id="setterHostBadge"
          >
            HOST
          </span>
        </div>
    
        <div class="role-body">
          <span class="role-name" id="setterName">—</span>
    
          <!-- Kick button (host-only, opponent-only) -->
          <button
            class="kick-btn hidden"
            id="kickSetterBtn"
            aria-label="Kick player"
          >
            ✕
          </button>
        </div>
      </div>
    
      <!-- SWITCH ROLES -->
      <button
        id="switchRolesBtn"
        class="role-switch"
        aria-label="Switch roles"
      >
        <span class="arrow setter-arrow">⇄</span>
        <span class="arrow guesser-arrow">⇄</span>
      </button>
    
      <!-- GUESSER -->
      <div class="role-card guesser">
        <div class="lobby-role-header">
          <span class="role-title">Guesser</span>
    
          <!-- Host badge -->
          <span
            class="host-badge hidden"
            id="guesserHostBadge"
          >
            HOST
          </span>
        </div>
    
        <div class="role-body">
          <span class="role-name" id="guesserName">—</span>
    
          <!-- Kick button -->
          <button
            class="kick-btn hidden"
            id="kickGuesserBtn"
            aria-label="Kick player"
          >
            ✕
          </button>
        </div>
      </div>
    
    </div>
    
    <!-- LOBBY FOOTER -->
    <div class="lobby-footer">
      <button id="leaveRoomBtn" class="leave-btn">
        Leave
      </button>
      
      <button id="readyBtn" class="primary-btn">
        I’m Ready
      </button>
    </div>

  
    <!-- TIMER OPTIONS -->
    <div class="timer-select">
  
      <label class="timer-option">
        <input type="radio" name="timePreset" value="bullet"  />
        <span>Bullet</span>
        <small>1 min / round</small>
      </label>
  
      <label class="timer-option">
        <input type="radio" name="timePreset" value="blitz" />
        <span>Blitz</span>
        <small>3 min / round</small>
      </label>
  
      <label class="timer-option">
        <input type="radio" name="timePreset" value="deep" />
        <span>Deep</span>
        <small>15 min total</small>
      </label>

      <label class="timer-option">
        <input type="radio" name="timePreset" value="none"  />
        <span>Unlimited</span>
      </label>
  
    </div> 
    <div class="ranked-status">
    <span id="rankedBadge"></span>
  
    <label id="rankedToggleWrapper">
      <input type="checkbox" id="rankedToggle" />
      Ranked match
    </label>
  </div>


  </div>
</section>
    <!-- ========== MENU ========== -->
    <section id="menu" class="screen">
       <h2 class="screen-title">Summary</h2>
       <div class="panel">          
         <button id="shareResultBtn" class="secondary-btn">Share</button> 
         <div id="roundSummary" class="summary-box"></div>
          <p><b>Room:</b> <span id="menuRoomCode"></span></p>
       </div>
       <button id="newMatchBtn" class="primary-btn">New Match</button>
    </section>
  
    <!-- ========== SETTER ========== -->
    <section id="setterScreen" class="screen theme-setter">
       <!-- HEADER TOP ROW-->
          <header class="role-header">
            <!-- TOP ROW: identity + timer -->
            <div class="header-row header-top">
              <div class="header-left">
                <h2 class="screen-title">Setter</h2>
                <span class="room-meta">
                  <span class="room-code header-room-code"></span>
                  <span class="role-badge" id="setterRoleBadge">SETTER</span>
                </span>
              </div>
          
              <div class="header-right">
                <div class="timer-block">
                  <div class="timer-row self">
                    <span class="timer-label">YOU</span>
                    <span id="timerSetter" class="chess-timer"></span>
                  </div>
                
                  <div class="timer-row opponent">
                    <span class="timer-label">OPP</span>
                    <span id="timerGuesserOpponent" class="chess-timer opponent"></span>
                  </div>
                </div>
                <button class="constraint-toggle-btn" title="Toggle constraints">⧉</button>
                <button id="powerInfoBtnSetter" class="power-info-btn" aria-label="Power descriptions"> <span class="power-info-icon">?</span></button>
              </div>
            </div>   
          </header>
         <!-- PLAY AREA -->    
         <main class="play-area setter-play">
            <div class="play-row">
                <!-- LEFT: powers -->               
               <div class="play-col powers-col">
                 <div id="setterPowerContainer" class="power-container laser-scope"></div>     
                 <div id="SetterRemainingBox" class="remaining-box"  hidden></div>
               </div>
               <!-- CENTER: history + drafts -->
               <div class="play-col center-col">
                  <div id="constraintRowSetter" class="history-row constraint-row"></div>
                  <div id="setterGuesserSubmitted" class="history-tiles history-scroll"></div>
                  <div id="setterPreview" class="preview-box" hidden></div>
                  <div class="draft-row-wrap">
                     <div class="draft-stack">
                        <div id="draftSetter" class="history-tiles draft-layer"></div>
                     </div>
                  </div>
               </div>   
            </div>
            <!-- KEYBOARD AREA-->
             <div id="SetterInfoBadge" class="info badge"></div>
           <div id="keyboardSetter" class="keyboard"></div>
         </main>
         <!---Modals--->
        <section id="globalOverlays">
           <!-- Assassin Modal -->
           <div id="assassinModal" class="modal">
              <div class="modal-content">
                 <h3>Assassin Word</h3>
                 <p class="modal-instruction">
                    Choose a word that instantly ends the game if guessed.
                 </p>
                 <input id="assassinInput" class="modal-input" maxlength="5" autocomplete="off"
                    />
                 <div class="decision-row">
                    <button id="assassinSubmitBtn" class="primary-btn small">Confirm</button>
                    <button id="assassinCancelBtn" class="secondary-btn small">Cancel</button>
                 </div>
              </div>
           </div>
           <!-- Force Guesser Modal -->
           <div id="forceGuessModal" class="modal">
              <div class="modal-content">
                 <h3>Force Guess</h3>
                 <p id="forceGuessPrompt"></p>
                 <div id="forceGuessOptionsContainer"  class="decision-row"></div>
              </div>
           </div>
        </section>
      </section>
      <!-- ========== GUESSER ========== -->
    
     <section id="guesserScreen" class="screen theme-guesser">
       <!-- HEADER -->
        <header class="role-header">
          <!-- TOP ROW: identity + timer -->
          <div class="header-row header-top">
            <div class="header-left">
              <h2 class="screen-title">Guesser</h2>
              <span class="room-meta">
                <span class="room-code header-room-code"></span>
                <span class="role-badge" id="guesserRoleBadge">GUESSER</span>
              </span>
            </div>        
            <div class="header-right">
                <div class="timer-block">
                  <div class="timer-row self">
                    <span class="timer-label">YOU</span>
                    <span id="timerGuesser" class="chess-timer"></span>
                  </div>                
                  <div class="timer-row opponent">
                    <span class="timer-label">OPP</span>
                    <span id="timerSetterOpponent" class="chess-timer opponent"></span>
                  </div>
                </div>              
              <button class="constraint-toggle-btn" title="Toggle constraints">⧉</button>
              <button id="powerInfoBtnGuesser" class="power-info-btn" aria-label="Power descriptions"><span class="power-info-icon">?</span></button>
            </div>
          </div>
        </header>
       <!--- PLAY AREA---> 
       <main class="play-area guesser-play">
          <div class="play-row">
             <!-- LEFT: POWERS -->
             <div class="play-col powers-col">
                <div id="guesserPowerContainer" class="power-container laser-scope">
                </div>                
             </div>
             <!-- CENTER: HISTORY TOP -->
             <div class="play-col center-col">
                <div id="constraintRowGuesser" class="history-row constraint-row"></div>
                <div id="historyGuesser" class="history-tiles history-scroll"></div>
                  <div class="draft-row-wrap">
                    <div class="draft-stack">
                      <div id="draftGuesser" class="history-tiles draft-layer"></div>
                    </div>
                  </div>
             </div>
          </div>
          <!--- KEYBOARD AREA---> 
          <div id="GuesserInfoBadge" class="info badge"></div>
          <div id="keyboardGuesser" class="keyboard"></div>
       </main>
    </section>
    </main>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>

  <div id="powerInfoPanelGuesser" class="power-info-panel" hidden></div>
