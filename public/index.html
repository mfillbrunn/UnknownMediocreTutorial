<!DOCTYPE html>
<html lang="en">
  <!---- INFO -->
<head>
  <title>VS Wordle — Competitive Mode</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 1. Themes & variables -->
  <link rel="stylesheet" href="css/themes.css">
  <!-- 2. Global defaults -->
  <link rel="stylesheet" href="css/base.css">
  <!-- 3. Structural layout -->
  <link rel="stylesheet" href="css/layout.css">
  <!-- 4. Reusable UI components -->
  <link rel="stylesheet" href="css/components.css">
  <!-- 5. Wordle board / history system -->
  <link rel="stylesheet" href="css/history.css">
  <!-- 6. Game & UI states -->
  <link rel="stylesheet" href="css/states.css">
  <!-- 7. Animations (keyframes) -->
  <link rel="stylesheet" href="css/animations.css">
  <!-- 8. Power-specific effects -->
  <link rel="stylesheet" href="css/powers.css">
</head>
<body>
  <script>
    /* Required by your JS */
    const $ = id => document.getElementById(id);
  </script>
    <div id="appContainer">
      <!-- ========== HEADER ========== -->
      <header class="app-header">
        <h1 class="title">VS WORDLE</h1>
        <div id="toast" class="toast"></div>
      </header>
    <!-- ========== MAIN ========== -->
      <main id="appMain">
        <!-- ========== LOBBY ========== -->
        <section id="lobby" class="screen active screen-lobby">
           <h2 class="screen-title">Online Lobby</h2>
           <!-- Primary actions -->
            <div class="lobby-actions">
              <button id="createRoomBtn" class="primary-btn">Create Room</button>
              <button id="quickJoinBtn" class="secondary-btn">Quick Join</button>
            </div>     
           <!-- Manual join -->
            <div class="join-block">
              <input id="joinRoomInput" type="text" maxlength="8" placeholder="Room Code">
              <button id="joinRoomBtn" class="primary-btn small">Join</button>
            </div>
           <div id="roomInfo" class="panel" hidden>
              <p><b>Room:</b> <span id="roomCodeLabel" class="room-code"></span></p>
              <div class="panel-section">
                <label>
                  <b>Timer mode:</b>
                  <select id="timerModeSelect" class="short-input">
                    <option value="round" selected>Round timer (time per round)</option>
                    <option value="chess">Chess timer (total time per match)</option>
                  </select>
                </label>
              </div>              
              <div class="panel-section">
                <label>
                  <b>Time:</b>
                  <select id="timeControlSelect" class="short-input">
                    <option value="0">No time</option>
                    <!-- Round timer values (seconds per round) -->
                    <option value="30">30 secs</option>
                    <option value="60" selected>1 min</option>
                    <option value="90">1.5 min</option>
                    <option value="120">2 min</option>       
                    <option value="300">5 min</option>
                    <option value="600">10 min</option>
                  </select>
                </label>
              </div>
              <div class="panel-section">
                 <label><b>Powers:</b>
                 <input id="powerCountInput" type="number" min="1" max="10" value="2" class="short-input">
                 </label>
                 <button id="applyPowerCountBtn" class="primary-btn small">Apply</button>
              </div>
              <p><b>You are:</b> <span id="lobbyRoleLabel">-</span></p>
              <label>
              <b>Name:</b>
              <input id="playerNameInput" type="text" maxlength="16" placeholder="Your name" class="short-input"/>
              </label>      
              <label class="color-picker-row">
              <input type="checkbox" id="useCustomColor">
              <span>Use custom accent color</span>
              </label>            
              <label class="color-picker-row">
              <span>Accent color</span>
              <input type="color" id="playerColorPicker" disabled>
              </label>
              <button id="switchRolesBtn" class="secondary-btn">Switch Roles</button>
              <button id="readyBtn" class="primary-btn">I'm Ready</button>
           </div>
           <p id="lobbyStatus" class="status"></p>
        </section>
  
    <!-- ========== MENU ========== -->
    <section id="menu" class="screen">
       <h2 class="screen-title">Game Menu</h2>
       <div class="panel">          
         <button id="shareResultBtn" class="secondary-btn">Share</button> 
         <div id="roundSummary" class="summary-box"></div>
          <p><b>Room:</b> <span id="menuRoomCode"></span></p>
       </div>
       <button id="newMatchBtn" class="primary-btn">New Match</button>
    </section>
  
    <!-- ========== SETTER ========== -->
    <section id="setterScreen" class="screen theme-setter">
       <!-- HEADER TOP ROW-->
          <header class="role-header theme-setter">
            <!-- TOP ROW: identity + timer -->
            <div class="header-row header-top">
              <div class="header-left">
                <h2 class="screen-title">Setter</h2>
                <span class="room-meta">
                  <span class="room-code header-room-code"></span>
                  <span class="role-badge" id="setterRoleBadge">SETTER</span>
                </span>
              </div>
          
              <div class="header-right">
                <span id="timerSetter" class="chess-timer">5:00</span>
                <button class="constraint-toggle-btn" title="Toggle constraints">⧉</button>
                <button id="powerInfoBtnSetter" class="power-info-btn" aria-label="Power descriptions"> <span class="power-info-icon">?</span></button>
              </div>
            </div>   
          </header>
         <!-- PLAY AREA -->    
         <main class="play-area setter-play">
            <div class="play-row">
                <!-- LEFT: powers -->               
               <div class="play-col powers-col">
                 <div id="setterPowerContainer" class="power-container laser-scope">
                 </div>                  
               </div>
               <!-- CENTER: history + drafts -->
               <div class="play-col center-col">
                  <div id="constraintRowSetter" class="history-row constraint-row"></div>
                  <div id="setterGuesserSubmitted" class="history-tiles history-scroll"></div>
                  <div id="setterPreview" class="preview-box" hidden></div>
                  <div class="draft-row-wrap">
                     <div class="draft-stack">
                        <div id="draftSetter" class="history-tiles draft-layer"></div>
                     </div>
                  </div>
               </div>   
            </div>
            <!-- KEYBOARD AREA-->
           <div id="SetterInfoBadge" class="info badge"></div> 
           <div id="keyboardSetter" class="keyboard"></div>
         </main>
         <!---Modals--->
        <section id="globalOverlays">
           <!-- Assassin Modal -->
           <div id="assassinModal" class="modal">
              <div class="modal-content">
                 <h3>Assassin Word</h3>
                 <p class="modal-instruction">
                    Choose a word that instantly ends the game if guessed.
                 </p>
                 <input id="assassinInput" class="modal-input" maxlength="5" autocomplete="off"
                    />
                 <div class="decision-row">
                    <button id="assassinSubmitBtn" class="primary-btn small">Confirm</button>
                    <button id="assassinCancelBtn" class="secondary-btn small">Cancel</button>
                 </div>
              </div>
           </div>
           <!-- Force Guesser Modal -->
           <div id="forceGuessModal" class="modal">
              <div class="modal-content">
                 <h3>Force Guess</h3>
                 <p id="forceGuessPrompt"></p>
                 <div id="forceGuessOptionsContainer"  class="decision-row"></div>
              </div>
           </div>
        </section>
      </section>
      <!-- ========== GUESSER ========== -->
    
     <section id="guesserScreen" class="screen theme-guesser">
       <!-- HEADER -->
        <header class="role-header theme-guesser">
          <!-- TOP ROW: identity + timer -->
          <div class="header-row header-top">
            <div class="header-left">
              <h2 class="screen-title">Guesser</h2>
              <span class="room-meta">
                <span class="room-code header-room-code"></span>
                <span class="role-badge" id="guesserRoleBadge">GUESSER</span>
              </span>
            </div>        
            <div class="header-right">
              <span id="timerGuesser" class="chess-timer">5:00</span>
              <button class="constraint-toggle-btn" title="Toggle constraints">⧉</button>
              <button id="powerInfoBtnGuesser" class="power-info-btn" aria-label="Power descriptions"><span class="power-info-icon">?</span></button>
            </div>
          </div>
        </header>
       <!--- PLAY AREA---> 
       <main class="play-area guesser-play">
          <div class="play-row">
             <!-- LEFT: POWERS -->
             <div class="play-col powers-col">
                <div id="guesserPowerContainer" class="power-container laser-scope">
                </div>                
             </div>
             <!-- CENTER: HISTORY TOP -->
             <div class="play-col center-col">
                <div id="constraintRowGuesser" class="history-row constraint-row"></div>
                <div id="historyGuesser" class="history-tiles history-scroll"></div>
                  <div class="draft-row-wrap">
                    <div class="draft-stack">
                      <div id="draftGuesser" class="history-tiles draft-layer"></div>
                    </div>
                  </div>
             </div>
          </div>
          <!--- KEYBOARD AREA---> 
          <div id="GuesserInfoBadge" class="info badge"></div>
          <div id="keyboardGuesser" class="keyboard"></div>
       </main>
    </section>
    </main>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>
  <!-- ========== JS (unchanged) ========== -->
  <script src="/socket.io/socket.io.js"></script>
  
  <script src="/game-engine/scoring.js"></script>
  <script src="/game-engine/history.js"></script>
  <script src="/game-engine/preview.js"></script>
  
  <script src="network/socketClient.js"></script>
  
  <script src="ui/flashViolations.js"></script>
  <script src="ui/constraints.js"></script>
  <script src="ui/draftrow.js"></script>
  <script src="ui/keyboard.js"></script>
  <script src="ui/history.js"></script>
  <script src="ui/timers.js"></script>
  <script src="ui/colorPicker.js"></script>
  
  <script src="client/helpers.js"></script>
  
  <script src="client/tooltips.js"></script>
  <script src="client/power-functions.js"></script>

  
  <script src="powerEngine/powerMetadata.js"></script>
  <script src="client/InfoBadgeEngine.js"></script>
  <script src="client/remaining-words.js"></script>
  <script src="powerEngine/powerEngine.js"></script>
  <script src="powerRules.js"></script>
  
  <script src="powerEngine/powers/hideTile.js"></script>
  <script src="powerEngine/powers/confuseColors.js"></script>
  <script src="powerEngine/powers/countOnly.js"></script>
  <script src="powerEngine/powers/blindGuess.js"></script>
  <script src="powerEngine/powers/forceGuess.js"></script>
  <script src="powerEngine/powers/revealGreen.js"></script>
  <script src="powerEngine/powers/freezeSecret.js"></script>
  <script src="powerEngine/powers/suggestGuess.js"></script>
  <script src="powerEngine/powers/suggestSecret.js"></script>
  <script src="powerEngine/powers/forceTimer.js"></script>
  <script src="powerEngine/powers/revealHistory.js"></script>
  <script src="powerEngine/powers/blindSpot.js"></script>
  <script src="powerEngine/powers/stealthGuess.js"></script>
  <script src="powerEngine/powers/magicMode.js"></script>
  <script src="powerEngine/powers/vowelRefresh.js"></script>
  <script src="powerEngine/powers/revealLetter.js"></script>
  <script src="powerEngine/powers/assassinWord.js"></script>
  <script src="client/summary.js"></script>
  <script src="client.js"></script>
  <script src="client/socket-events.js"></script>
  <script src="client/roomid.js"></script>
  <div id="powerInfoPanelSetter" class="power-info-panel" hidden></div>
  <div id="powerInfoPanelGuesser" class="power-info-panel" hidden></div>
</body>
</html>
