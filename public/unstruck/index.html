<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unstruck – a daily word puzzle</title>
  <meta name="description" content="Find the secret word among 16. Three new grids every day.">
  <meta name="theme-color" content="#1d2027">
  <link rel="icon" href="../assets/unstruck/unstruck-logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Link previews (WhatsApp, iMessage, Reddit, X...). Most apps only show
       the image from a full https:// address: scripts/build-unstruck.js fills
       in og:image, og:url and twitter:image with the site's address (SITE_URL,
       set in that script) when it builds the standalone site. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Unstruck">
  <meta property="og:title" content="Unstruck – a daily word puzzle">
  <meta property="og:description" content="Find the secret word among 16. Three new grids every day.">
  <meta property="og:image" content="og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Unstruck: a 4×4 grid of words, some struck out in red">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Unstruck – a daily word puzzle">
  <meta name="twitter:description" content="Find the secret word among 16. Three new grids every day.">
  <meta name="twitter:image" content="og-image.png">

  <link rel="stylesheet" href="unstruck.css?v=3">
  <link rel="stylesheet" href="../css/daily-pick.css?v=74">
</head>
<body data-unstruck-standalone>
  <main class="unstruck-page">
    <section id="dailyPickScreen" class="screen active" aria-label="Unstruck"></section>
  </main>
  <!-- Analytics: GoatCounter (unstruck.goatcounter.com). It counts visits and
       where they came from, plus four Unstruck moments: started (first guess of
       the day), finished (with the golf result), shared, practice.
       No cookies, no personal data. -->
  <script data-goatcounter="https://unstruck.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <script src="../client/daily-pick.js?v=114" data-words="../wordlists/daily-pick-words.txt" data-media="../unstruck-media/"></script>
</body>
</html>
