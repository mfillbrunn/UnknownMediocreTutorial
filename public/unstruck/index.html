<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unstruck – a daily word puzzle</title>
  <meta name="description" content="Find the secret word among 16. Three new grids every day.">
  <meta name="theme-color" content="#1b1a18">
  <link rel="icon" href="../assets/unstruck/unstruck-logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Link previews (WhatsApp, iMessage, Reddit, X...). Most apps only show
       the image from a full https:// address: scripts/build-unstruck.js fills
       in og:image, og:url and twitter:image with the site's address (SITE_URL,
       set in that script) when it builds the standalone site. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Unstruck">
  <meta property="og:title" content="Unstruck – a daily word puzzle">
  <meta property="og:description" content="Find the secret word among 16. Three new grids every day.">
  <meta property="og:image" content="og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Unstruck: find the one word, strike out the rest. One green word stands, the others lie crossed out.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Unstruck – a daily word puzzle">
  <meta name="twitter:description" content="Find the secret word among 16. Three new grids every day.">
  <meta name="twitter:image" content="og-image.png">

  <link rel="stylesheet" href="unstruck.css?v=7">
  <link rel="stylesheet" href="../css/daily-pick.css?v=153">
</head>
<body data-unstruck-standalone>
  <main class="unstruck-page">
    <section id="dailyPickScreen" class="screen active" aria-label="Unstruck">
      <!-- Shown at once while the game's code loads; the game replaces it. -->
      <div class="dp-preload">
        <svg class="dp-preload-logo" viewBox="0 0 96 96" aria-hidden="true"><g fill="#3a3733"><rect x="4" y="4" width="40" height="40" rx="10"/><rect x="52" y="4" width="40" height="40" rx="10"/><rect x="4" y="52" width="40" height="40" rx="10"/></g><rect x="52" y="52" width="40" height="40" rx="10" fill="#4f9b5c"/><path d="M13 24h22M61 24h22M13 72h22" stroke="#e5484d" stroke-width="4.5" stroke-linecap="round"/><path d="M62 72.5l6.5 6.5 13-14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="dp-preload-title">Unstruck</div>
        <div class="dp-preload-pitch">Find the secret word among 16.<br>Three grids, about 3 minutes.</div>
        <div class="dp-preload-dots" aria-label="Loading"><i></i><i></i><i></i></div>
      </div>
    </section>
  </main>
  <!-- Analytics: GoatCounter (unstruck.goatcounter.com). It counts visits and
       where they came from, plus four Unstruck moments: started (first guess of
       the day), finished (with the golf result), shared, practice.
       No cookies, no personal data. -->
  <script data-goatcounter="https://unstruck.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <script src="../client/daily-pick.js?v=204" data-words="../wordlists/daily-pick-words.txt" data-media="../unstruck-media/"></script>
</body>
</html>
