<svg viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#241417"/>
    <stop offset="100%" stop-color="#170d0f"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Card -->
<rect x="4" y="4" width="202" height="202" rx="22" fill="url(#bg)" stroke="#ff4b5c" stroke-width="2"/>

<!-- Icon: a folder with evidence squares dissolving off it -->
<g transform="translate(32 42)" filter="url(#glow)">
  <rect x="4" y="6" width="34" height="10" rx="3" fill="none" stroke="#ff8a93" stroke-width="4" stroke-linejoin="round"/>
  <rect x="0" y="14" width="92" height="58" rx="8" fill="none" stroke="#ff8a93" stroke-width="4" stroke-linejoin="round"/>
  <rect x="80" y="30" width="16" height="16" rx="3" fill="#ff4b5c" opacity="0.9"/>
  <rect x="102" y="16" width="12" height="12" rx="2" fill="#ff4b5c" opacity="0.6"/>
  <rect x="118" y="42" width="9" height="9" rx="2" fill="#ff4b5c" opacity="0.35"/>
  <rect x="132" y="24" width="6" height="6" rx="1.5" fill="#ff4b5c" opacity="0.2"/>
</g>

<!-- Divider -->
<line x1="35" x2="175" y1="135" y2="135" stroke="#4a2429"/>

<!-- Title -->
<text x="105" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#F3F6FC" letter-spacing="1" font-family="Inter, Segoe UI, Arial, sans-serif">HIDE EVIDENCE</text>

</svg>
